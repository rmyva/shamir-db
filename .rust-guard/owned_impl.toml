# Owned-impl assertions for `rust-guard structure` (rule 5, `OWNED_IMPL`).
#
# Every inherent `impl <type>` must live in the type's defining module
# (`module`) or a descendant of it. Trait impls are not governed.
# The file's logical module path is derived from its physical path under
# the package's `src/` directory (`crate::a::b`).

[[owned_impl]]
type = "RepoInstance"
module = "crate::repo::instance::repo_instance"

[[owned_impl]]
# owner: <foreign-impl> — impl blocks are deliberately split across the table
# layer (read/, write/, admission/, table_manager/); since R4b the layer is the
# crate shamir-engine-table, so the layer root is its crate root.
type = "TableManager"
module = "crate"

[[owned_impl]]
# owner: <foreign-impl> — declared and implemented in support/storage/catalog
# of shamir-engine-table.
type = "TableCatalog"
module = "crate::support::storage::catalog"

[[owned_impl]]
# owner: <foreign-impl> — declared and implemented in the journal backend's
# durability_handle module.
type = "DurabilityHandle"
module = "crate::journal::backend::durability_handle"

[[owned_impl]]
# owner: <foreign-impl> — declared in the changefeed submodule.
type = "ChangefeedHandle"
module = "crate::journal::backend::durability_handle::changefeed"

[[owned_impl]]
# owner: <foreign-impl> — declared in the retention_gate submodule.
type = "RetentionGate"
module = "crate::journal::backend::durability_handle::retention_gate"

[[owned_impl]]
# owner: <foreign-impl> — declared in the migration coordinator submodule.
type = "MigrationCoordinator"
module = "crate::table_manager::migration::coordinator"

[[owned_impl]]
# owner: <engine-layering-R2c1b> — tx crate aggregate; inherent impl ownership follows its defining source modules.
type = "RepoCore"
module = "crate::commit::core"

[[owned_impl]]
# owner: <engine-layering-R2c1b> — tx crate aggregate; inherent impl ownership follows its defining source modules.
type = "TxHorizon"
module = "crate::commit::core"

[[owned_impl]]
# owner: <FILE-HEADROOM-b> — impls span admin and ops in query types, plus
# trait impls in query builder; the rule matches the type basename workspace-wide.
type = "BatchOp"
module = "crate"

[[owned_impl]]
# owner: <FILE-HEADROOM-b> — impls span api, session, interner_cache,
# receipts, and visibility.
type = "Client"
module = "crate"

[[owned_impl]]
# owner: <FILE-HEADROOM-b> — private guard and its impl are colocated in request.
type = "ScratchReturn"
module = "crate::client::api::request"

[[owned_impl]]
# owner: <FILE-HEADROOM-b> — private guard and its impl are colocated in request.
type = "RegistrationGuard"
module = "crate::client::api::request"

[[owned_impl]]
# owner: <FILE-HEADROOM-b> — private guard and its impls are colocated in request.
type = "WriteCancelGuard"
module = "crate::client::api::request"

[[owned_impl]]
# owner: <FILE-HEADROOM-b> — logical child of state/session; this owner is
# the planned physical location under server/infra, which the rule checks.
type = "SessionStore"
module = "crate::server::infra::session_store"

[[owned_impl]]
# owner: <FILE-HEADROOM-b> — impls live in tx_context and
# support/core/tx_dependency_tracking, both under tx.
type = "TxContext"
module = "crate::tx"
