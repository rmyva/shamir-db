# Пороговые значения WAL учитывают нагрузку; подстройте их под профиль записи.
# BackupFailing, BackupRetentionFailing и BackupStale определены только в shamir-backup.rules.yml.
{
  "groups": [
    {"name":"shamir","rules":[
      {"alert":"ShamirWalTruncationBacklog","expr":"shamir_wal_truncation_lag_versions > 10000","for":"10m","labels":{"severity":"warning"},"annotations":{"summary":"Сохраняется backlog усечения WAL","description":"Threshold: truncation lag >10,000 versions for 10m. First check retained WAL, repository pins and truncation worker progress."}},
      {"alert":"ShamirWalGrowth","expr":"rate(shamir_wal_bytes_total[5m]) > 10485760 and shamir_wal_truncation_lag_versions > 10000","for":"10m","labels":{"severity":"warning"},"annotations":{"summary":"Рост WAL и backlog усечения высоки","description":"Threshold: WAL growth >10 MiB/s and truncation lag >10,000 versions for 10m. First check retention, active pins, WAL sync and storage latency."}},
      {"alert":"ShamirReplicaLagVersions","expr":"shamir_replication_lag_versions > 1000","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Реплика отстаёт по версиям","description":"Threshold: >1,000 versions for 5m. First check leader write rate, follower durable bookmark, stream state and network."}},
      {"alert":"ShamirReplicaReceiptAge","expr":"shamir_replication_lag_seconds > 300 and shamir_replication_lag_versions > 0","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Старая квитанция при ненулевом отставании реплики","description":"Threshold: receipt age >300s and version lag >0 for 5m. Receipt age can grow during healthy idle; first confirm the leader is writing."}},
      {"alert":"ShamirQueryErrorGrowth","expr":"increase(shamir_query_errors_total[15m]) > 0","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Появились новые ошибки запросов","description":"Threshold: any new query error in 15m, sustained for 5m. First break down by code and check client traffic and server logs."}},
      {"alert":"ShamirGateBlockerStuck","expr":"shamir_gate_oldest_blocker_age_seconds > 300","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Блокирующая версия долго не разрешается","description":"Threshold: oldest blocker age >300s for 5m, independently of acknowledgement waiters. First inspect blocker class/version and transaction or orphan replay."}},
      {"alert":"ShamirVisibilityBlocked","expr":"shamir_gate_oldest_blocker_age_seconds > 300 and shamir_visibility_ack_waiters > 0","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Ожидания видимости заблокированы","description":"Threshold: oldest blocker >300s with one or more acknowledgement waiters for 5m. First inspect blocker class/version and transaction or orphan replay; do not blindly restart."}},
      {"alert":"ShamirVisibilityPendingTimeout","expr":"increase(shamir_visibility_pending_total{reason=\"timeout\"}[5m]) > 0","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Зафиксирован timeout видимости","description":"Threshold: any timeout-pending outcome in 5m, sustained for 5m. First inspect visibility gate blockers and write completion latency."}},
      {"alert":"ShamirVisibilityReopenRequired","expr":"increase(shamir_visibility_pending_total{reason=\"reopen_required\"}[5m]) > 0","for":"5m","labels":{"severity":"critical"},"annotations":{"summary":"Для продолжения видимости требуется reopen","description":"Threshold: any reopen-required outcome in 5m, sustained for 5m. First inspect WAL outcome and repository recovery state; do not bypass reopen fencing."}},
      {"alert":"ShamirVisibilityReadWaitTimeouts","expr":"increase(shamir_visibility_read_wait_timeouts_total[5m]) > 0","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Чтение AsOf превысило ожидание видимости","description":"Threshold: any read-wait timeout in 5m, sustained for 5m. First inspect gate blocker age and the requested visibility horizon."}},
      {"alert":"ShamirVisibilityReconciliationLoop","expr":"increase(shamir_visibility_reconciliation_total{result=\"pending_timeout\"}[15m]) > 5","for":"10m","labels":{"severity":"warning"},"annotations":{"summary":"Повторяются timeout reconciliation видимости","description":"Threshold: >5 pending_timeout outcomes in 15m, sustained for 10m. First inspect orphan replay progress and blocker class/version."}},
      {"alert":"ShamirAuthenticationAnomaly","expr":"rate(auth_attempts_total{result=~\"bad_proof|locked_out\"}[5m]) > 1 or rate(shamir_login_http_total{result=\"authentication_failed\"}[5m]) > 1","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Повышено число ошибок аутентификации","description":"Threshold: >1 failed native or HTTP login per second for 5m. First check expected traffic, client configuration and possible credential abuse."}},
      {"alert":"ShamirReplicationIdentityMismatch","expr":"increase(shamir_repl_identity_mismatch_total[15m]) > 0","for":"1m","labels":{"severity":"critical"},"annotations":{"summary":"Проверка identity репликации отказала узлу","description":"Threshold: any identity mismatch in 15m. First check lineage/history epoch and peer identity; do not bypass fencing."}},
      {"alert":"ShamirArgon2Refusals","expr":"rate(shamir_argon2_busy_refusals_total[5m]) > 0","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Отказы admission Argon2 продолжаются","description":"Threshold: refusal rate above zero for 5m. First check clock health, then permit capacity, admission and blocking-pool pressure."}},
      {"alert":"ShamirConnectionSaturation","expr":"increase(shamir_connections_rejected_total[5m]) > 0","for":"2m","labels":{"severity":"warning"},"annotations":{"summary":"Подключения отклонялись из-за общего лимита","description":"Threshold: any rejection in 5m, sustained for 2m. First check active connections and configured limit before raising capacity."}},
      {"alert":"ShamirPostAuthRateLimit","expr":"increase(shamir_post_auth_rate_limit_rejected_total[5m]) > 0","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Запросы после аутентификации ограничиваются по частоте","description":"Threshold: any post-auth rejection in 5m. First check per-session request patterns and client retries."}},
      {"alert":"ShamirResponseBudgetWaiters","expr":"shamir_response_budget_waiters > 0","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Ответы ожидают бюджет байтов","description":"Threshold: one or more waiters persist for 5m. First compare used/cap and batch reservations; check max_inflight_response_bytes and result caps."}},
      {"alert":"ShamirResponseBudgetNearCap","expr":"shamir_inflight_response_bytes_cap > 0 and shamir_inflight_response_bytes_used / shamir_inflight_response_bytes_cap > 0.9","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Резерв бюджета ответов близок к пределу","description":"Threshold: used/cap >90% for 5m. This is reserved capacity, not RSS; first check concurrent batches and configured caps."}},
      {"alert":"ShamirActiveRequestsGrowth","expr":"deriv(shamir_active_requests[10m]) > 0.1 and shamir_active_requests > 100","for":"10m","labels":{"severity":"warning"},"annotations":{"summary":"Число активных запросов устойчиво растёт","description":"Threshold: >100 active requests and growth >0.1 requests/s over 10m. First check long-running queries, clients and request cancellation."}}
    ]}
  ]
}
