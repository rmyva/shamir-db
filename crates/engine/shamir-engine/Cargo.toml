[package]
name = "shamir-engine"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
description = "ShamirDB engine — DbInstance / RepoInstance / TableManager / IndexManager."
license = "MIT OR Apache-2.0"

[dependencies]
shamir-engine-validator = { path = "../shamir-engine-validator" }
shamir-types = { path = "../../foundation/shamir-types" }
shamir-collections = { path = "../../foundation/shamir-collections" }
# Backends inherit `shamir-storage`'s feature set — the engine doesn't
# need any backend-specific code, but its `BoxRepoFactory` variants
# are gated by the same flags so they cascade through.
shamir-storage = { path = "../../storage/shamir-storage", default-features = false }
# Pure DTOs for the SDBQL surface — re-exported through the engine's
# `query::*` modules so callers see no path change.
shamir-query-types = { path = "../../query/shamir-query-types" }
# Query evaluation leaf, re-exported by the engine facade.
shamir-engine-query = { path = "../shamir-engine-query" }
# Repo layer (journal / meta / seed), re-exported by the engine facade
# at shamir_engine::repo::*.
shamir-engine-repo = { path = "../shamir-engine-repo" }
# Table layer (table manager, reads, writes), re-exported through the engine facade.
shamir-engine-table = { path = "../shamir-engine-table" }
# Transaction layer, re-exported through the facade's tx module.
shamir-engine-tx = { path = "../shamir-engine-tx" }
# Built-in scalar + aggregate function library. Dispatched from the
# filter / set / group-by paths via the engine's shared registries.
shamir-funclib = { path = "../../query/shamir-funclib" }
shamir-wasm-host = { path = "../../wasm/shamir-wasm-host" }
shamir-tunables = { path = "../../foundation/shamir-tunables" }
shamir-wal = { path = "../../storage/shamir-wal" }
shamir-tx = { path = "../../storage/shamir-tx" }
shamir-index = { path = "../../index/shamir-index" }

# Async / runtime
tokio = { version = "1.49.0", features = ["full"] }
async-stream = "0.3"
futures = "0.3"
async-trait = "0.1.81"
bytes = "1.11.0"
dashmap = "6.1.0"

# Data
serde = { version = "1.0.217", features = ["derive"] }
rustc-hash = "2.1"
# Inline storage for field-path Vec<u64> (1-3 segments typical) —
# avoids heap alloc per FilterNode / SelectProjection. Already a
# transitive dep via several crates.
smallvec = { version = "1.11", features = ["serde"] }
rand = "0.9.2"
log = "0.4"               # log!/info!/warn! macros throughout engine
regex = "1.11.1"          # query::filter::eval Regex matcher
indexmap = { version = "2.7", features = ["serde"] }  # ordered maps in batch
rmp-serde = "1.3.0"       # query result encoding helpers
rmpv = { version = "1.3.1", features = ["serde"] }
bincode = "1.3.3"         # admin / index serialisation
serde_bytes = "0.11"      # efficient byte-slice serde for shadow log
thiserror = "2.0"         # error types throughout engine
scc = "3.8"               # lock-free concurrent hashmap (repo, validator)
arc-swap = "1.7"          # RCU-style atomic Arc swap (table_manager)
# Decimal cross-type comparison in the filter / order-by layers (Dec
# operands and Dec sort keys). Same version as shamir-types; already a
# transitive dep via shamir-types / shamir-funclib, so zero new compilation.
rust_decimal = { version = "1.40.0", features = ["serde"] }
# Big cross-type comparison in the order-by layer (`QvSortKey::Big`, FG-6).
# Same version as shamir-types; already a transitive dep via shamir-types,
# so zero new compilation — promoted from [dev-dependencies] because
# `order.rs` (production code) now names `BigInt` directly, mirroring the
# `rust_decimal` dependency above for the identical Dec cross-type reason.
num-bigint = { version = "0.4", features = ["serde"] }

[features]
# Cascade `shamir-storage`'s per-backend features upward so callers can
# pick them at the engine level too:
#   shamir-engine = { default-features = false, features = ["fjall"] }
#
# `all-backends` lists every per-backend feature explicitly (NOT just
# `shamir-storage/all-backends`) because the engine's own `BoxRepo` /
# `BoxRepoFactory` variants are gated by the engine-level features —
# enabling storage backends without enabling the matching engine
# feature would compile away the variant constructors.
default = ["all-backends"]
all-backends = ["fjall"]
# Opt-in: enables the N=100_000 long variant in the `fts_indexed` bench.
# Setup takes several seconds per fixture (seeding 100k records + FTS
# postings) and pushes past Criterion's default measurement window, so
# it's gated to keep the default `cargo bench --bench fts_indexed` run
# bounded.
fts_indexed_long = []
fjall  = ["shamir-storage/fjall", "shamir-engine-repo/fjall", "shamir-engine-table/fjall", "shamir-engine-tx/fjall"]
# Also exposes query::auth::SessionPermissions.
# Exposes test-only fault-injection seams (currently
# `RepoInstance::install_table_for_test`) to downstream crates whose OWN
# tests need them — a plain `#[cfg(test)]` item is private to whichever
# crate is being compiled in test mode and would not exist when
# shamir-engine is pulled in as a normal dependency. Enabled by
# `shamir-db`'s `[dev-dependencies]` (audit #540 regression test); never
# enabled by default, so nothing ships in a production build.
test-util = ["shamir-engine-query/test-util", "shamir-engine-validator/test-util", "shamir-engine-repo/test-util", "shamir-engine-table/test-util", "shamir-engine-tx/test-util"]
# F-56 (#882): enables the loom model-checker module in the table crate.
# The table crate's build script emits `cfg(loom)` only for that crate.
loom = ["shamir-engine-table/loom"]

[target.'cfg(unix)'.dev-dependencies]
dhat = "0.3"

[dev-dependencies]
shamir-engine-query = { path = "../shamir-engine-query", features = ["test-util"] }
shamir-engine-table = { path = "../shamir-engine-table", features = ["test-util"] }
# Facade durability/seed tests use the repo crate's test-only seams.
shamir-engine-repo = { path = "../shamir-engine-repo", features = ["test-util"] }
shamir-engine-tx = { path = "../shamir-engine-tx", features = ["test-util"] }
tokio = { version = "1.49.0", features = ["test-util", "process", "io-util", "time", "rt"] }
bench-scale-tool = { workspace = true, features = ["async"] }
tempfile = "3.10.1"
serial_test = "3.3.1"
shamir-bench-utils = { path = "../../devtools/shamir-bench-utils" }
# RSS sampling for the `vector_report` example (V0.4). Reads the OS
# resident-set size (procfs on Linux, mach_task_basic_info on macOS,
# GetProcessMemoryInfo on Windows) — order-of-magnitude only, never a
# precise allocation profile (use `peak_mem` / `dhat` for that).
memory-stats = "1.2"
# Tests build queries via the typed query builder instead of raw wire values.
# query-builder depends only on query-types/types — no cycle on engine.
shamir-query-builder = { path = "../../query/shamir-query-builder" }
# Failure-only flake diagnostics (design: docs/dev-artifacts/design/flake-failure-logs.md)
# — dev-only crate; adopted by the CRIT-2 truncation-ceiling test. No `tracing`
# feature: shamir-engine emits `log` records only.
shamir-test-diag = { path = "../../devtools/shamir-test-diag" }
# (No dev-dep cycle on shamir-db. The two tests that needed the
# `ShamirDb` facade — `admin_tests.rs`, `auth_tests.rs` — moved to
# `crates/engine/shamir-db/tests/` as integration tests instead. Keeping the
# cycle would have made cargo compile shamir-engine twice and the
# `BatchError` types from the two copies wouldn't match.)

[[bench]]
name = "keyset_seek"
path = "benches/backend/keyset_seek.rs"
harness = false
