[package]
name = "shamir-funclib"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
description = "Built-in scalar function library for ShamirDB (math, strings, arrays, cast, datetime, value_nav, validate, encode, object, text, crypto)."
license = "MIT OR Apache-2.0"

[dependencies]
# Value model — every scalar fn operates on QueryValue.
shamir-types = { path = "../../foundation/shamir-types" }
shamir-collections = { path = "../../foundation/shamir-collections" }

# Runtime-aware scalar dispatch and one-time inline-runtime warning.
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread"] }
log = "0.4"

# Lock-free concurrent hashmap for the user-scalar layer (ScalarResolver).
scc = "3.8"

# Canonical-key serialisation for the order-independent record hash (/crypto
# canonical_hash). serde gives the `Serialize` bound on map keys; rmp-serde
# turns a key into its deterministic byte form for sorting.
serde = { version = "1.0.217", features = ["derive"] }
rmp-serde = "1.3.0"

# Numeric (/math, /cast)
rust_decimal = { version = "1.40.0", features = ["serde", "maths"] }
num-bigint = { version = "0.4", features = ["serde"] }

# Text (/str, /text, /validate regex family)
regex = "1.11.1"
unicode-normalization = "0.1.24"
strsim = "0.11.1"

# Temporal (/datetime): UTC-only APIs, no bundled/system time-zone database.
jiff = { version = "0.2.24", default-features = false, features = ["std"] }

# Encoding (/encode)
base64 = "0.22.1"
hex = "0.4.3"
data-encoding = "2.10.0"
percent-encoding = "2.3.2"
serde_json = "1"

# Crypto — pure/deterministic primitives (/crypto scalar subset)
sha2 = "0.11"
sha3 = "0.12.0"
# `pure`: no C/assembly build (cc) -- SSE2/SSE4.1/AVX2 stay on Rust intrinsics;
# only the AVX-512 C/asm path (and NEON C on aarch64) is dropped.
blake3 = { version = "1.5", features = ["pure"] }
hmac = "0.13"
subtle = "2.6.1"
# Argon2id KDF — deterministic given (password, salt, params). CPU/memory-bound:
# callers dispatching it on an async runtime must hand off the worker.
argon2 = "0.5"

# Generation (/gen) — impure/non-deterministic. Same version as shamir-types.
rand = "0.9.2"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "time"] }
bench-scale-tool = { workspace = true }

[[bench]]
name = "distinct_arrays"
harness = false

[lib]
# Doctests are banned project-wide (slow: recompile-per-example). Examples
# live as illustration; behavioural coverage is in unit/integration tests.
doctest = false

[lints]
workspace = true
