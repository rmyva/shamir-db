[package]
name = "shamir-query-types"
version = "0.1.0-alpha.1"
publish = false
edition = "2021"
description = "Pure DTOs for ShamirDB's SDBQL query language (Filter, ReadQuery, BatchRequest, ...)."
license = "MIT OR Apache-2.0"

[dependencies]
shamir-collections = { path = "../../foundation/shamir-collections" }
shamir-types = { path = "../../foundation/shamir-types" }

# Pure data dependencies — DTOs serialize to msgpack and use
# ordered maps for deterministic iteration.
serde      = { version = "1.0.217", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde  = "1.3"
indexmap   = { version = "2.7", features = ["serde"] }

# `num-bigint` is needed to construct `QueryValue::Big(BigInt)` for the
# unified u64 contract: a `u64 > i64::MAX` now promotes losslessly to `Big`
# in `QueryRecord`'s `visit_u64` instead of being clamped. Mirrors
# `shamir-types`' version + `serde` feature.
num-bigint = { version = "0.4", features = ["serde"] }

# Pure-data helpers for HMAC-confirmed destructive ops. `hmac` +
# `sha2` are stable, no-std-capable, already used elsewhere in the
# workspace (shamir-connect). Keeping the helpers in this crate
# lets both client and server share one canonical implementation.
# Behind the `crypto` feature so that guest-core (WASM) builds can
# skip heavy crypto deps.
hmac       = { version = "0.13", optional = true }
sha2       = { version = "0.11", optional = true }

[features]
default = ["crypto", "server"]
# `SecretString` (re-exported from shamir-types::secret) lives one layer
# down now; its own zeroize-on-drop is gated by shamir-types' own
# `crypto` feature — forward it here so guest-core (WASM) builds that
# disable this crate's `crypto` also skip zeroize in shamir-types.
crypto  = ["dep:hmac", "dep:sha2", "shamir-types/crypto"]
server  = []

[dev-dependencies]
bench-scale-tool = { workspace = true }
serde_json = "1"
# Snapshot scanner (wire_dictionary_scan_tests): parses crate sources with
# syn to rebuild the wire-dictionary table and pin declaration order.
syn = { version = "2.0.114", features = ["derive", "parsing", "full"] }
# Integer-keyed MessagePack construction in the decode proof tests
# (wire_dictionary_decode_tests): hand-built indexed wire frames for the
# real DTOs, under exact byte-level test control.
rmp = "0.8.15"

[[bench]]
name = "batch_planner"
harness = false

[lib]
# Doctests are banned project-wide (slow: recompile-per-example). Examples
# live as illustration; behavioural coverage is in unit/integration tests.
doctest = false

[lints]
workspace = true
