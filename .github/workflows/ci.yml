name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # ready_for_review is what starts the FULL tier when a draft is promoted.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      range:
        description: 'Commit range to compute (empty selects the branch since its merge base with master; an explicit range or crates list makes the run not merge-ready)'
        required: false
        default: ''
        type: string
      crates:
        description: 'Explicit space-separated workspace packages (bypasses computed selection)'
        required: false
        default: ''
        type: string
      scope:
        description: 'Pre-release button: choose workspace to run every crate'
        required: false
        default: computed
        type: choice
        options: [computed, workspace]
  # Weekly safety net: macOS cells run only here and on workflow_dispatch;
  # pull_request and push runs skip them (CI-05).
  schedule:
    - cron: '17 3 * * 1'

# A newer push to the same PR cancels the older (superseded) run so it stops
# hogging the shared runner pool. Master pushes, scheduled and manual runs
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep this block identical to cache-warm.yml: rust-cache hashes these
  # environment variables into its cache key.
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default. Every job here (fmt/clippy/test/integration/ts-unit/
# cooldown) only reads the repo and runs builds/tests — none pushes a commit,
# comments on a PR, or uploads to a registry, so no write scope is granted.
# (rust-cache + setup-node cache writes work under this scope — same pattern
# release.yml's gate jobs already rely on.)
permissions:
  contents: read

jobs:
  # TIER PLANNER. Decides once per run whether the FULL matrix runs; every
  # full-tier job gates on `needs.plan.outputs.full == 'true'`, every
  # fast-tier job on the negation, and the merge gate reads it to pick the
  # tier it judges. FULL is selected by: ready_for_review / a non-draft PR,
  # master pushes, workflow_dispatch, schedule — and by a DRAFT PR whose HEAD
  # commit message carries the marker `[ci full]` alone on a line
  # (scripts/ci/gates/full_tier_plan.py, unit-tested). Only the head commit
  # counts: one marker buys one full run, the next push is fast again. The
  # message is fetched through the API into a file and never interpolated
  # into a shell line. Tests always use the matrix computed in `affected`.
  # Set from the test-matrix contract and validated by filterset.py.
  plan:
    name: tier plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: PR head commit message (draft PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq .commit.message > "$RUNNER_TEMP/head-message.txt"
      - name: Decide the tier
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          set -euo pipefail
          message="$RUNNER_TEMP/head-message.txt"
          [ -f "$message" ] || : > "$message"
          python3 -I scripts/ci/gates/full_tier_plan.py --event "$EVENT_NAME" --draft "$DRAFT" --message-file "$message"

  affected:
    name: affected crates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: plan
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      args: ${{ steps.select.outputs.args }}
      engine: ${{ steps.select.outputs.engine }}
      ts: ${{ steps.select.outputs.ts }}
      node: ${{ steps.select.outputs.node }}
      wasm32: ${{ steps.select.outputs.wasm32 }}
      deny: ${{ steps.select.outputs.deny }}
      pipeline: ${{ steps.select.outputs.pipeline }}
      docs_only: ${{ steps.select.outputs.docs_only }}
      lib_args: ${{ steps.select.outputs.lib_args }}
      integration_args: ${{ steps.select.outputs.integration_args }}
      integration_filter: ${{ steps.select.outputs.integration_filter }}
      check_args: ${{ steps.select.outputs.check_args }}
      run_lib: ${{ steps.select.outputs.run_lib }}
      run_integration: ${{ steps.select.outputs.run_integration }}
      run_check: ${{ steps.select.outputs.run_check }}
      run_engine: ${{ steps.select.outputs.run_engine }}
      run_ts: ${{ steps.select.outputs.run_ts }}
      run_node: ${{ steps.select.outputs.run_node }}
      run_wasm32: ${{ steps.select.outputs.run_wasm32 }}
      run_deny: ${{ steps.select.outputs.run_deny }}
      run_pipeline: ${{ steps.select.outputs.run_pipeline }}
      manual_partial: ${{ steps.manual.outputs.manual_partial }}
      tree_green: ${{ steps.tree.outputs.tree_green }}
      tree_reason: ${{ steps.tree.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Capture cargo metadata
        run: cargo metadata --locked --no-deps --format-version 1 > cargo-metadata.json
      - name: Compute and validate the test matrix
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/ci/matrix/filterset.py plan --event-file "$GITHUB_EVENT_PATH" --event "$EVENT_NAME" --metadata cargo-metadata.json --format github-output >> "$GITHUB_OUTPUT"
      - name: Flag a manual run that tests a partial selection
        id: manual
        env:
          EVENT_NAME: ${{ github.event_name }}
          RANGE_INPUT: ${{ github.event.inputs.range }}
          CRATES_INPUT: ${{ github.event.inputs.crates }}
          SCOPE_INPUT: ${{ github.event.inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          partial=false
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "${SCOPE_INPUT:-computed}" != workspace ]              && { [ -n "$RANGE_INPUT" ] || [ -n "$CRATES_INPUT" ]; }; then
            partial=true
          fi
          echo "manual_partial=$partial" >> "$GITHUB_OUTPUT"
      - name: Check for an equivalent green PR tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            python3 -I scripts/ci/matrix/tree_green.py --repo "$REPO" --before "$BEFORE" --after "$AFTER" --format github-output >> "$GITHUB_OUTPUT"
          else
            printf 'tree_green=false\nreason=not_push\n' >> "$GITHUB_OUTPUT"
          fi

  # Test selection is computed once in `affected` by the matrix helper.
  fast:
    name: fast tier (draft PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, affected]
    if: needs.plan.outputs.full != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # full history: the affected-crates script diffs against origin/master
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - name: matrix helper unit tests
        run: |
          python3 -I -m unittest discover -s scripts/ci/tests
          python3 -I -m unittest discover -s scripts/ci/tests/matrix
      # Layout limits (CLAUDE.md): <=7 direct entries per folder, <=1000
      # physical lines per source file, ratcheted against the committed
      # scripts/ci/layout_baseline.txt. Instant, stdlib-only; runs
      # unconditionally, including docs-only diffs (which skip clippy/tests).
      - name: layout check
        run: python3 -I scripts/ci/check_layout.py
      - name: wasm32 guest check (matrix flag)
        if: needs.affected.outputs.run_wasm32 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo check -p shamir-sdk --target wasm32-unknown-unknown --locked
          cargo check -p shamir-sdk --features query-builder --target wasm32-unknown-unknown --locked
          cargo clippy -p shamir-sdk --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p shamir-sdk --features query-builder --target wasm32-unknown-unknown --locked -- -D warnings
      - name: cargo clippy (selected packages)
        if: needs.affected.outputs.run_check == 'true' || needs.affected.outputs.run_pipeline == 'true'
        env:
          CHECK_ARGS: ${{ needs.affected.outputs.check_args }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a packages <<< "$CHECK_ARGS"
          cargo clippy --locked --all-targets "${packages[@]}" -- -D warnings
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
        if: needs.affected.outputs.run_lib == 'true'
        with:
          tool: nextest@0.9.137
      - name: lib tests (selected crates)
        if: needs.affected.outputs.run_lib == 'true'
        env:
          LIB_ARGS: ${{ needs.affected.outputs.lib_args }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a packages <<< "$LIB_ARGS"
          ./scripts/test.sh --locked "${packages[@]}"
      - name: doctests (shamir-engine compile-fail gate)
        if: needs.affected.outputs.run_engine == 'true'
        run: cargo test --doc -p shamir-engine --locked
      - name: rustdoc gate (shamir-engine, draft tier)
        if: needs.affected.outputs.run_engine == 'true'
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: |
          cargo doc -p shamir-engine --no-deps --document-private-items --locked
          cargo doc -p shamir-engine --no-deps --document-private-items --locked --no-default-features
          cargo doc -p shamir-engine-query --no-deps --document-private-items --locked
          cargo doc -p shamir-engine-query --no-deps --document-private-items --locked --features test-util
          cargo doc -p shamir-engine-validator --no-deps --document-private-items --locked
          cargo doc -p shamir-engine-validator --no-deps --document-private-items --locked --features test-util

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: matrix helper unit tests
        run: |
          python3 -I -m unittest discover -s scripts/ci/tests
          python3 -I -m unittest discover -s scripts/ci/tests/matrix
      # FULL-tier layout check (same as the fast tier's; together the two
      # cover every PR and every master push).
      - name: layout check
        run: python3 -I scripts/ci/check_layout.py

  # Lint on ubuntu and windows on every PR (macOS joins on workflow_dispatch
  # and the weekly schedule: CI-05, the macOS runner queue is the bottleneck).
  # Crucial for cross-platform correctness:
  # `#[cfg(windows)]` / `#[cfg(target_os = "macos")]` branches (service
  # installers, runtime, signal handling) are ONLY compiled — and therefore
  # only linted — on the matching OS. An ubuntu-only clippy never saw them.
  clippy:
    name: cargo clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.run_check == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: cargo clippy (selected packages)
        if: needs.affected.outputs.run_check == 'true' || needs.affected.outputs.run_pipeline == 'true'
        env:
          CHECK_ARGS: ${{ needs.affected.outputs.check_args }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a packages <<< "$CHECK_ARGS"
          cargo clippy --locked --all-targets "${packages[@]}" -- -D warnings

  # Compile both SDK feature shapes for the guest target; the affected-scope
  # guard keeps unrelated full-tier changes from paying for this check.
  wasm32-guest-check:
    name: wasm32 guest check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.run_wasm32 == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: wasm32 guest check (matrix flag)
        if: needs.affected.outputs.run_wasm32 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo check -p shamir-sdk --target wasm32-unknown-unknown --locked
          cargo check -p shamir-sdk --features query-builder --target wasm32-unknown-unknown --locked
          cargo clippy -p shamir-sdk --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p shamir-sdk --features query-builder --target wasm32-unknown-unknown --locked -- -D warnings

  # CI-03b: rustdoc gate. Docs are code: a broken intra-doc link or an
  # accidentally-private documented item fails CI like any other compile
  # error (`-D` promotes both lints to errors via RUSTDOCFLAGS). Only
  # shamir-engine, shamir-engine-query and shamir-engine-validator are documented (the engine doctest gate is
  # the compile-fail boundary); shamir-db / shamir-server rustdoc is a
  # known limitation for a later round. Runs once with default features
  # and once with none, so doc comments under feature-gated items resolve
  # in both configurations. ubuntu-only: rustdoc output is OS-independent.
  rustdoc:
    name: cargo doc (shamir-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.run_engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - if: needs.affected.outputs.run_engine == 'true'
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc -p shamir-engine --no-deps --document-private-items --locked
      - if: needs.affected.outputs.run_engine == 'true'
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc -p shamir-engine --no-deps --document-private-items --locked --no-default-features

      - if: needs.affected.outputs.run_engine == 'true'
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc -p shamir-engine-query --no-deps --document-private-items --locked
      - if: needs.affected.outputs.run_engine == 'true'
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc -p shamir-engine-query --no-deps --document-private-items --locked --features test-util
      - if: needs.affected.outputs.run_engine == 'true'
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc -p shamir-engine-validator --no-deps --document-private-items --locked
      - if: needs.affected.outputs.run_engine == 'true'
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc -p shamir-engine-validator --no-deps --document-private-items --locked --features test-util
      - name: engine scope notice
        if: needs.affected.outputs.run_engine != 'true'
        shell: bash
        run: 'echo "::notice::shamir-engine not affected: rustdoc gate skipped"'

  # CI-03b: engine feature matrix. Each cell compiles shamir-engine in
  # ISOLATION (`-p shamir-engine --lib`, never a workspace invocation that
  # could unify feature defaults back in) with check + clippy, then asserts
  # — via scripts/ci/gates/features_matrix_check.py, which resolves the cell
  # with a dev-free `cargo tree -e normal,build,features` invocation — that
  # the ENABLED feature set matches the cell exactly, so "no defaults" is
  # proven, not just labelled.  WHY --lib ONLY in the cells: `--all-targets`
  # activates dev-dependencies and workspace feature unification, so the
  # cell is NOT isolated — CI evidence (round of 2026-10-19): the cell
  # labelled `--no-default-features` still resolved
  # {default, all-backends, fjall, test-util}.  The lib-only cells are the
  # isolated proof; the single --all-targets pair lives only in the
  # default-plus cell, where defaults are on anyway and the unified
  # resolution legitimately equals the label.  Reduced-feature cells catch
  # missing `cfg` guards that the workspace-wide jobs unify away.
  # Feature resolution is OS-independent, so PR runs use ubuntu only; the
  # windows and macOS cells run on workflow_dispatch and the weekly schedule.
  engine-features:
    name: engine features (${{ matrix.cell.id }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.run_engine == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        cell:
          - { id: no-default, flags: "--no-default-features" }
          - { id: fjall, flags: "--no-default-features --features fjall" }
          - { id: test-util, flags: "--no-default-features --features test-util" }
          - { id: fjall-test-util, flags: "--no-default-features --features fjall,test-util" }
          - { id: default-plus, flags: "--features test-util,fts_indexed_long" }
          - { id: loom, flags: "--features loom" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: feature-resolution assertion
        if: needs.affected.outputs.run_engine == 'true'
        run: python3 -I scripts/ci/gates/features_matrix_check.py --expected ${{ matrix.cell.id }} --flags="${{ matrix.cell.flags }}"
      - if: needs.affected.outputs.run_engine == 'true'
        run: cargo check -p shamir-engine --lib --locked ${{ matrix.cell.flags }}
      - if: needs.affected.outputs.run_engine == 'true'
        run: cargo clippy -p shamir-engine --lib --locked ${{ matrix.cell.flags }} -- -D warnings
      - run: cargo clippy -p shamir-engine-query --lib --locked -- -D warnings
        if: matrix.cell.id == 'no-default' && needs.affected.outputs.run_engine == 'true'
      - run: cargo clippy -p shamir-engine-query --lib --locked --features test-util -- -D warnings
        if: matrix.cell.id == 'test-util' && needs.affected.outputs.run_engine == 'true'
      - run: cargo clippy -p shamir-engine-validator --lib --locked -- -D warnings
        if: matrix.cell.id == 'no-default' && needs.affected.outputs.run_engine == 'true'
      - run: cargo clippy -p shamir-engine-validator --lib --locked --features test-util -- -D warnings
        if: matrix.cell.id == 'test-util' && needs.affected.outputs.run_engine == 'true'
      # --all-targets ONLY here: under dev-dependency/workspace unification
      # it would falsely enable features in the reduced cells (see CI
      # evidence above); in default-plus the resolution equals the label.
      - run: cargo check -p shamir-engine --all-targets --locked ${{ matrix.cell.flags }}
        if: matrix.cell.id == 'default-plus' && needs.affected.outputs.run_engine == 'true'
      - run: cargo clippy -p shamir-engine --all-targets --locked ${{ matrix.cell.flags }} -- -D warnings
        if: matrix.cell.id == 'default-plus' && needs.affected.outputs.run_engine == 'true'
      - name: engine scope notice
        if: needs.affected.outputs.run_engine != 'true'
        shell: bash
        run: 'echo "::notice::shamir-engine not affected: engine feature cells skipped"'

  # CI-03b: fast-tier shadow of `engine-features` — cells 1 and 5 on
  # ubuntu, only while the PR is a draft AND shamir-engine is affected
  # (same affected-crates detection as the `fast` job). Cheap early
  # signal; the full matrix above is the merge gate.
  engine-features-fast:
    name: engine features fast (draft PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, affected]
    if: needs.plan.outputs.full != 'true' && needs.affected.outputs.run_engine == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: engine feature cells 1 and 5
        if: needs.affected.outputs.run_engine == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/ci/gates/features_matrix_check.py --expected no-default --flags=--no-default-features
          python3 -I scripts/ci/gates/features_matrix_check.py --expected default-plus --flags='--features test-util,fts_indexed_long'
          cargo check -p shamir-engine --lib --locked --no-default-features
          cargo clippy -p shamir-engine --lib --locked --no-default-features -- -D warnings
          cargo check -p shamir-engine --lib --locked --features test-util,fts_indexed_long
          cargo clippy -p shamir-engine --lib --locked --features test-util,fts_indexed_long -- -D warnings
          cargo check -p shamir-engine --all-targets --locked --features test-util,fts_indexed_long
          cargo clippy -p shamir-engine --all-targets --locked --features test-util,fts_indexed_long -- -D warnings

  # Windows cold-cache 30-min timeout fix (owner decision 2026-10-30): the
  # workspace compile/link was the dominant, OS-dependent cost inside `test`'s
  # 30-minute budget. This job compiles only the lib test binaries ONCE per OS
  # with its own 60-minute budget and packs them into a nextest archive; only
  # the lib `test` job consumes it. `integration` builds in place.
  # The warm base cache comes from cache-warm.yml via the same composite action
  # (.github/actions/build-test-archive) and its rust-cache shared key.
  test-build:
    name: test build archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.run_lib == 'true' && needs.affected.outputs.tree_green != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/build-test-archive
        with:
          upload: 'true'
          artifact-name: test-archive-${{ matrix.os }}
          packages: ${{ needs.affected.outputs.lib_args }}

  # Fast primary signal: the ~2700 library unit tests, on every OS. Matches
  # the project's stated pre-commit gate in CLAUDE.md ("Code quality
  # (MANDATORY)"): `./scripts/test.sh` (the nextest wrapper — raw
  # `cargo test` is blocked outright by the perimeter guard). Kept as its
  # own job so the dominant signal stays fast and is not held hostage by
  # the slower, heavier integration build below. Matrixed across OSes so
  # Windows / macOS regressions (path handling, file locking, fsync) are
  # caught.
  test:
    name: cargo test lib (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [plan, affected, test-build]
    if: ${{ !cancelled() && needs.plan.outputs.full == 'true' && (needs.affected.outputs.run_lib == 'true' || needs.affected.outputs.run_engine == 'true') && needs.affected.outputs.tree_green != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      # Pinned to the cargo-nextest version documented as the perimeter-guard
      # baseline in .config/nextest.toml (0.9.137, commit 75ddba7e9). The
      # cargo-runner guard in .cargo/config.toml gates on the $NEXTEST env var
      # that cargo-nextest sets; pinning prevents a silent future upgrade from
      # renaming/removing it and fail-closing ALL test runs. The shorthand
      # `taiki-e/install-action@nextest` form cannot pin a version — the
      # full-form `@v2` + `with: { tool: "nextest@X.Y.Z" }` is required.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
        with:
          tool: nextest@0.9.137
      # The lib tests come prebuilt in the archive from `test-build`; the only
      # compile left in this job is the ubuntu doctest below (shamir-engine and
      # its dependency graph), so the caches stay on for ubuntu only.
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        if: matrix.os == 'ubuntu-latest'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
        if: matrix.os == 'ubuntu-latest'
      - name: enable sccache
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: download test archive
        if: needs.affected.outputs.run_lib == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: test-archive-${{ matrix.os }}
          path: ${{ runner.temp }}
      # bash on every runner (Git Bash on Windows) — `./scripts/test.sh` is
      # a bash script; without this, GitHub Actions defaults `run:` steps
      # to PowerShell on windows-latest, which cannot execute it directly.
      # Parity with the `integration` job's own `shell: bash` below.
      - name: lib tests from archive (timed)
        if: needs.affected.outputs.run_lib == 'true'
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          ./scripts/test.sh --from-archive "$RUNNER_TEMP/test-archive.tar.zst"
          end=$(date +%s)
          echo "lib tests ran in $((end - start))s" >> "$GITHUB_STEP_SUMMARY"
      # Per-test durations from the archived lib run (CI-TIMINGS): same
      # never-fail-a-job rule as the integration job's timing artifacts.
      - name: upload nextest JUnit report
        if: always() && needs.affected.outputs.run_lib == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-lib-${{ matrix.os }}
          path: |
            target/nextest/ci/junit-cargo-tests.xml
            junit-cargo-tests.xml
          if-no-files-found: ignore
          retention-days: 14
      # S5c-X P2 (Round 6): nextest cannot run doctests — enforce the
      # shamir-engine boundary compile-fail gate explicitly (one OS is
      # enough; the fast-tier affected step covers the rest).
      - name: doctests (shamir-engine compile-fail gate)
        if: matrix.os == 'ubuntu-latest' && needs.affected.outputs.run_engine == 'true'
        run: cargo test --doc -p shamir-engine --locked
      - name: test selection notice
        if: needs.affected.outputs.run_lib != 'true' && needs.affected.outputs.run_engine != 'true'
        run: echo "::notice::matrix selected no lib tests or engine doctests"

  # Integration gate: the test files under `crates/*/*/tests/`. Before this
  # job these only had to COMPILE (clippy --all-targets) — they never RAN
  # on a PR. This includes the only real fsync-durability-across-restart
  # coverage (`shamir-server/tests/server_meta.rs`, `persistence_e2e.rs`,
  # `backup_restore_e2e.rs`), the in-process server↔client TLS+SCRAM e2e
  # (`mvp_e2e.rs`, `mvp_ws_e2e.rs`, `shamir-e2e/tests/smoke.rs`), the
  # connection-cap / slow-loris defences (`max_connections.rs`,
  # `slow_loris.rs`) and the `shamir-db/tests/query_*.rs` wire-path suite.
  #
  # `--test '*'` selects ONLY the integration test targets. We deliberately
  # do NOT use `--all-targets` here: that also builds and *runs* the
  # `criterion` benches (each `bench` target has a real `fn main` via
  # `criterion_main!`), so `cargo test --all-targets` would execute the
  # full benchmark suites — slow and pointless as a correctness gate.
  #
  # Thread policy: default (parallel). Every integration test was audited
  # to be parallel-safe — each uses its own `tempfile::TempDir` and binds
  # TCP listeners to an ephemeral port (`127.0.0.1:0`, OS-assigned), so
  # there are no shared-disk-path or fixed-port collisions across tests.
  # (The one fixed-relative-path test, `storage_sled::test_sled_transact_atomic`
  # at `./test_data/sled_transact`, is a `--lib` test gated by the `test`
  # job above, not an integration target, and uses a path unique to that
  # test — it does not collide with siblings.) If a future integration
  # test introduces a shared-path/fixed-port hazard, gate it with
  # `serial_test::#[serial]` (already a dev-dependency) rather than
  # forcing `--test-threads=1` on the whole suite.
  #
  # NOTE: the Node.js napi e2e suite under `tests/e2e/` AND the TS client
  # e2e suite (`crates/client/shamir-client-ts/src/__tests__/**/e2e-*.test.ts`) are
  # intentionally NOT wired into this per-PR gate — both require a release
  # `shamir-server` build (and the napi one needs the MSVC-built
  # `shamir-client-node` binding, a regular workspace member), too heavy
  # for every PR. They now run on the scheduled nightly workflow
  # `.github/workflows/ts-e2e-nightly.yml` (cron + `workflow_dispatch`).
  # The pure-TS unit tests for `shamir-client-ts` ARE gated per-PR — see the
  # `ts-unit` job below (the e2e-* suites self-skip there because no server
  # binary is built in that job).
  # Matrixed across OSes — this is the suite that actually exercises sockets,
  # TLS+SCRAM, fsync-durability-across-restart, and the storage backends'
  # on-disk file locking, where OS differences bite hardest.
  integration:
    name: cargo test integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.tree_green != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The ubuntu runner ran out of disk while linking the integration test
      # binaries (ENOSPC, `ld` SIGBUS). Drop preinstalled toolchains this job
      # never uses before building, and print the free space before/after so a
      # shrinking margin is visible in the log.
      - name: free disk space (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      # Pinned to the cargo-nextest version documented as the perimeter-guard
      # baseline in .config/nextest.toml (0.9.137, commit 75ddba7e9). The
      # cargo-runner guard in .cargo/config.toml gates on the $NEXTEST env var
      # that cargo-nextest sets; pinning prevents a silent future upgrade from
      # renaming/removing it and fail-closing ALL test runs. The shorthand
      # `taiki-e/install-action@nextest` form cannot pin a version — the
      # full-form `@v2` + `with: { tool: "nextest@X.Y.Z" }` is required.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      # bash on every runner (Git Bash on Windows). `-E 'kind(test)'` selects
      # ONLY integration test binaries (crates/*/*/tests/*.rs) — the nextest
      # filterset equivalent of cargo's `--test '*'` target selector; it
      # deliberately excludes `kind(lib)` (covered by the `test` job above)
      # and `kind(bench)` (never a correctness gate). $AFFECTED narrows the
      # packages to those affected by the diff.
      - name: integration tests (selected binaries)
        env:
          INTEGRATION_ARGS: ${{ needs.affected.outputs.integration_args }}
          INTEGRATION_FILTER: ${{ needs.affected.outputs.integration_filter }}
          SHAMIR_CARGO_TIMINGS: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$INTEGRATION_FILTER" ]; then echo "::notice::matrix has no matching integration targets"; exit 0; fi
          read -r -a packages <<< "$INTEGRATION_ARGS"
          ./scripts/test.sh --full --locked "${packages[@]}" -E "$INTEGRATION_FILTER" --no-tests=fail
      # Timing artifacts (CI-TIMINGS): machine-readable build and test
      # timings, 14-day retention. `if: always()` keeps them on failing
      # runs, where they matter most; a failed upload must never fail the
      # job (continue-on-error + if-no-files-found: ignore).
      - name: upload nextest JUnit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-integration-${{ matrix.os }}
          path: |
            target/nextest/ci/junit-cargo-tests.xml
            junit-cargo-tests.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: upload cargo timings report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cargo-timings-integration-${{ matrix.os }}
          path: target/cargo-timings
          if-no-files-found: ignore
          retention-days: 14
      - name: integration selection notice
        if: needs.affected.outputs.run_integration != 'true' && needs.affected.outputs.run_pipeline != 'true'
        shell: bash
        run: echo "::notice::matrix selected no integration binaries"
      - name: disk usage after the run
        if: always() && runner.os != 'Windows'
        shell: bash
        run: df -h / && du -sh target 2>/dev/null || true

  # Pure-TypeScript unit tests for `crates/client/shamir-client-ts` (query
  # builders, framing, hmac, msgpack round-trips — the
  # `src/core/**/__tests__/*.test.ts` surface). Cheap (seconds), no Rust
  # toolchain and no server binary needed.
  #
  # The TS package's `npm test` (vitest run) ALSO collects the
  # `src/__tests__/**/e2e-*.test.ts` suites, but those self-skip via
  # `describe.skipIf(!SERVER_AVAILABLE)` when no `shamir-server` release
  # binary is resolvable (see `src/__tests__/e2e-harness.ts`'s
  # `SERVER_AVAILABLE` / `serverBinPath()`: `SHAMIR_SERVER_BIN` →
  # `$CARGO_TARGET_DIR/release/<exe>` → `<repo>/target/release/<exe>`).
  # This job sets NONE of those and runs no `cargo build`, so
  # `SERVER_AVAILABLE` is false and ONLY the pure unit tests execute — the
  # e2e-* suites run for real in `ts-e2e-nightly.yml` instead.
  #
  # ubuntu-only: pure TS, no OS-specific behaviour (these tests assert wire
  # shapes and builder output, not filesystem or socket semantics).
  ts-unit:
    name: ts unit (shamir-client-ts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.run_ts == 'true' && needs.affected.outputs.tree_green != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Gate: the `affected` planner job's `ts` flag — true when the TS
      # package changed, `shamir-query-types` is in the closure, or the
      # selection is the whole workspace.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: needs.affected.outputs.run_ts == 'true'
        with:
          # Node 22 = active LTS. `shamir-client-ts/package.json` declares
          # no `engines` floor; `shamir-client-node`'s is `>=18`, so 22
          # satisfies both. Pinned for reproducibility.
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/client/shamir-client-ts/package-lock.json
      - run: npm ci && npm run typecheck && npm test
        if: needs.affected.outputs.run_ts == 'true'
        working-directory: crates/client/shamir-client-ts
      - name: ts scope notice
        if: needs.affected.outputs.run_ts != 'true'
        shell: bash
        run: 'echo "::notice::matrix selected no TypeScript tests"'

  # Dependency admission gate (RFC 3923 cooldown, fail-closed; policy:
  # /cooldown.toml, DEC-3 Q4). Fails the PR when it admits a registry version
  # younger than 3 days (present in the head Cargo.lock, absent from the
  # protected base) without an exact, unexpired entry in
  # /cooldown-exceptions.toml, and fails on any unused or expired entry. The
  # `--locked` flags above keep the other jobs on the committed Cargo.lock;
  # THIS job catches a PR that introduces a too-fresh dependency. Stdlib Python,
  # no toolchain: crates.io publication times and the RustSec advisory database
  # are read over the network and any failure to read them fails the job.
  cooldown:
    name: dependency cooldown (3d)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Select the protected base
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Master push (squash merge): use the event's explicit before SHA.
            base="$BEFORE"
          else
            git fetch --no-tags origin master
            base=$(git merge-base origin/master HEAD)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Fetch the RustSec advisory database
        run: git clone --depth 1 https://github.com/rustsec/advisory-db "$RUNNER_TEMP/advisory-db"
      - name: run dependency cooldown
        env:
          BASE_REF: ${{ steps.base.outputs.sha }}
          ADVISORY_DB: ${{ runner.temp }}/advisory-db
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/ci/gates/dependency_admission_check.py --base-ref "$BASE_REF" --advisory-db "$ADVISORY_DB"

  # Dependency licence + advisory gate (cargo deny, and the npm licence check).
  # The job ALWAYS reports on a ready PR / master push / dispatch so that the
  # aggregate `merge gate (required)` (and a required-check rule) is satisfiable
  # on every change; the WORK is skipped inside the job when no dependency input
  # changed since the base (owner requirement: licence checks only when the
  # dependencies were updated). Advisories that appear against an UNCHANGED
  # lock are caught by the weekly `audit` job in supply-chain.yml. The base is
  # the merge base on a PR and the previous master tip on a push; a manual
  # dispatch always runs everything.
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.run_deny == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Matrix-selected dependency gates
        id: deps
        env:
          RUN_DEPENDENCY_CHECKS: ${{ needs.affected.outputs.run_deny }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUN_DEPENDENCY_CHECKS" = "true" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "npm=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        if: steps.deps.outputs.rust == 'true'
      # Prebuilt, version-pinned binary (same install action and pin as nextest).
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
        if: steps.deps.outputs.rust == 'true'
        with:
          tool: cargo-deny@0.20.2
      # No `--locked` on deny itself; the lockfile is consulted read-only. All
      # four check categories (advisories, bans, licenses, sources) run.
      - run: cargo deny check
        if: steps.deps.outputs.rust == 'true'
      - run: python3 -I scripts/ci/gates/npm_licenses_check.py
        if: needs.affected.outputs.run_deny == 'true'
      # Native-code allowlist gate (docs/native-code.md): fails when a crate
      # that compiles C/C++/asm enters the built graph outside the allowlist,
      # or when a previously removed native crate (ring, zstd-sys, ...) comes
      # back. Needs cargo for the read-only `cargo tree` queries, so it runs
      # under the same condition as `cargo deny check` (any Cargo.toml/lock /
      # deny.toml / ci.yml change; manual dispatch always runs it).
      - run: python3 -I scripts/ci/gates/native_code_check.py
        if: steps.deps.outputs.rust == 'true'

  # F-80 (#907) — loom model-checker gate for the WriterDrainBarrier
  # interleaving contract (F-56, #882). This is the proof mechanism
  # referenced in three P0-fix doc comments (F-56/F-69/F-70); before this
  # job it existed but never ran in CI, so a future edit could silently
  # break the proven contract with nothing catching it before a human
  # happened to run the loom command by hand.
  #
  # Standalone job (not a step in `test`): needs a different feature flag
  # (`--features loom`), and model-checking is conceptually distinct from
  # correctness testing — keeping it separate lets it fail without noise
  # in the primary test signal, and vice versa.
  #
  # ubuntu-only (not matrixed): loom mocks the atomic operations
  # themselves — the model has no OS-specific behavior to exercise (no
  # sockets, no fsync, no file locking). CPU-bound model enumeration.
  #
  # Hard PR gate (blocks merge): the loom model is the interleaving-contract
  # proof backing three P0 fixes. It runs in ~0.2s (verified locally), well
  # within per-PR budget — no flakiness or runtime concern.
  #
  # Uses cargo-nextest (not bare `cargo test`): the `.cargo/config.toml`
  # perimeter guard blocks bare `cargo test` in CI too (it is committed).
  # Nextest passes the guard via $NEXTEST — same pattern every other test
  # job in this file uses. The loom model is a regular `#[test]`; nextest
  # discovers and runs it identically.
  loom-model:
    name: loom model (writer_drain_barrier)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.run_engine == 'true' && needs.affected.outputs.tree_green != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      # The `loom` feature triggers build.rs to emit `cfg(loom)` for THIS
      # crate only (not globally), so dependencies aren't dragged into
      # incompatible loom code paths. The `-E 'test(loom_model)'` filter
      # runs just the model-checker test (excluded from test.sh by design).
      # Discovery gate (CI-03b): fail BEFORE running when the filterset
      # matches zero tests — a renamed/moved/gated-away model must not
      # silently turn this job into a vacuous pass. nextest's own
      # `--no-tests=fail` (supported since 0.9.x, and by the pinned
      # 0.9.137) backs the same rule at run time.
      - name: discover loom model tests (must be non-empty)
        env:
          ENGINE: ${{ needs.affected.outputs.run_engine }}
          PIPELINE: ${{ needs.affected.outputs.run_pipeline }}
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest list -p shamir-engine --features loom --lib -E 'test(loom_model)' --message-format json > loom_list.json
          python3 -I scripts/ci/gates/loom_preflight_check.py --list-file loom_list.json --name-filter loom_model
          rm -f loom_list.json
      - name: loom model (affected crates)
        env:
          ENGINE: ${{ needs.affected.outputs.run_engine }}
          PIPELINE: ${{ needs.affected.outputs.run_pipeline }}
        shell: bash
        run: |
          cargo nextest run -p shamir-engine --features loom --lib -E 'test(loom_model)' --nocapture --no-tests=fail

  # rust-guard source-integrity gates (CI-03a). Runs the workspace-excluded
  # `tools/rust-guard` binary against the whole repo: `modules` (every
  # tracked `.rs` reachable from a target root or excepted), `structure`
  # (AST rules over the PR's changed files only — the VIS_WIDENING /
  # ALLOW_ADDED rules are diff-shaped by nature; on master pushes only
  # the whole-repo `modules` scan runs), and both `structure` and
  # `conservation` run only for touched packages in active campaigns in
  # `.rust-guard/stages.toml` (a no-op while that list is empty). Also re-runs the baseline-monotonic
  # and layout checks next to the tool whose findings they ratchet.
  #
  # Runs on draft AND ready PRs and master pushes (no draft-only `if:`):
  # the gates are cheap (seconds) and the whole point is catching structural
  # drift the moment it is written, not when the draft is promoted. The tool
  # is workspace-excluded, so the main fmt/clippy jobs never cover it — its
  # own fmt/clippy run here too. ubuntu-only: the tool parses git objects
  # and Rust sources; nothing OS-specific.
  source-integrity:
    name: rust-guard source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # full history: merge-base computation, `git show <rev>:<path>`
          # reads and the baseline check all need real git objects.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: rustfmt, clippy
      # Distinct cache scope so this job's build of the standalone tool does
      # not fight the workspace cache the other jobs share.
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        with:
          workspaces: tools/rust-guard
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: cache rust-guard binary
        id: source-guard-bin-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            tools/rust-guard/target/debug/rust-guard
            tools/rust-guard/target/debug/rust-guard.exe
          key: rust-guard-bin-${{ runner.os }}-${{ hashFiles('tools/rust-guard/**/*.rs', 'tools/rust-guard/Cargo.toml', 'tools/rust-guard/Cargo.lock', 'rust-toolchain.toml') }}
      # PRs only: on master pushes there is no merge base (HEAD *is*
      # master); the diff-shaped `structure`/`conservation` gates are
      # skipped there, the whole-repo `modules` scan still runs below.
      - name: compute merge base
        if: github.event_name == 'pull_request'
        run: echo "MERGE_BASE=$(git merge-base origin/master HEAD)" >> "$GITHUB_ENV"
      - name: build rust-guard
        if: steps.source-guard-bin-cache.outputs.cache-hit != 'true'
        run: cargo build --manifest-path tools/rust-guard/Cargo.toml --locked
      - name: rust-guard modules (whole repo)
        run: tools/rust-guard/target/debug/rust-guard modules --repo .
      - name: rust-guard orderings
        run: tools/rust-guard/target/debug/rust-guard orderings --repo . --pins .rust-guard/atomic_orderings.toml
      # Selection lives in scripts/ci/rust_guard_select.py (unit-tested in
      # scripts/ci/tests/test_rust_guard_select.py): it reads the changed
      # files on stdin, captures `cargo metadata` to a file ONCE, strips the
      # repo root from absolute manifest paths and emits package directories.
      # Any parse / usage error exits 2 — the step fails closed.
      - name: rust-guard campaign gates
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          git diff --name-only "$MERGE_BASE"...HEAD \
            | python3 -I scripts/ci/rust_guard_select.py \
                --stages .rust-guard/stages.toml \
                --metadata metadata.json --root . > campaigns.tsv
          guard="tools/rust-guard/target/debug/rust-guard"
          ran=0
          first_rc=0
          while IFS=$'\t' read -r name delta pkgs dirs ddelta; do
            [ -n "$name" ] || continue
            echo "::notice::structure+conservation campaign '$name' (packages: $pkgs)"
            scope_args=()
            IFS=',' read -ra scope_dirs <<< "$dirs"
            for dir in "${scope_dirs[@]}"; do scope_args+=(--scope "$dir"); done
            structure_rc=0
            conservation_rc=0
            "$guard" structure --repo . --changed-since "$MERGE_BASE" "${scope_args[@]}" \
              --delta "$delta" || structure_rc=$?
            "$guard" conservation --repo . \
              --base "$MERGE_BASE" --head HEAD \
              --packages "$pkgs" --delta "$delta" || conservation_rc=$?
            if [ "$conservation_rc" -ne 0 ]; then
              "$guard" conservation --repo . \
                --base "$MERGE_BASE" --head HEAD \
                --packages "$pkgs" --delta "$delta" \
                --suggest-delta "suggested-$name.toml" || true
            fi
            if [ "$first_rc" -eq 0 ]; then
              if [ "$structure_rc" -ne 0 ]; then first_rc=$structure_rc
              elif [ "$conservation_rc" -ne 0 ]; then first_rc=$conservation_rc
              fi
            fi
            ran=1
          done < campaigns.tsv
          rm -f metadata.json campaigns.tsv
          if [ "$ran" -eq 0 ]; then
            echo "::notice::no active campaign package touched by this diff; structure and conservation skipped"
          fi
          exit "$first_rc"
      - name: upload suggested deltas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rust-guard-suggested-delta
          path: suggested-*.toml
          if-no-files-found: ignore
      # Same ratchet the fmt job runs; repeated here so the source-integrity
      # job is self-contained (cheap, stdlib-only).
      - name: baseline monotonic check
        # Diff against the PR's merge base, not origin/master: the merge ref
        # is fixed when the PR syncs, so after another PR lowers the baseline
        # on master, origin/master-vs-HEAD would fail on NEW dirs master no
        # longer has. MERGE_BASE is set above (PRs only); master pushes fall
        # back to origin/master (HEAD == master, empty diff, passes).
        run: python3 -I scripts/ci/check_baseline_monotonic.py --base "${MERGE_BASE:-origin/master}" --head HEAD
      - name: layout check
        run: python3 -I scripts/ci/check_layout.py
      # The tool is workspace-excluded: the main fmt/clippy jobs never see
      # it, so it lints itself here.
      - run: cargo fmt --manifest-path tools/rust-guard/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/rust-guard/Cargo.toml --all-targets --locked -- -D warnings

  # CI-03b: compare compiled test inventories for every selected campaign
  # package at head and those present at the merge base, using the campaign's
  # discovery_delta. Base lists are cached by SHA, OS, config and packages.
  # Fast-tier drafts run ubuntu/default only; the full tier (ready PRs, or a
  # draft with the `[ci full]` marker) uses the full OS/config matrix.
  # No selected campaign means a no-op; non-PR events run format smoke.
  test-discovery:
    name: test discovery (${{ matrix.os }}, ${{ matrix.config.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [plan, affected]
    if: ${{ !cancelled() && needs.affected.result == 'success' && needs.affected.outputs.tree_green != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event.pull_request.draft && needs.plan.outputs.full != 'true') && '["ubuntu-latest"]' || (contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]')) }}
        config: ${{ fromJSON((github.event.pull_request.draft && needs.plan.outputs.full != 'true') && '[{"id":"default","flags":""}]' || '[{"id":"default","flags":""},{"id":"test-util-fts","flags":"--features shamir-engine/test-util,shamir-engine/fts_indexed_long"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # full history: merge-base computation and the base worktree
          # both need real git objects.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      # Pinned to the cargo-nextest version documented as the perimeter-guard
      # baseline in .config/nextest.toml (0.9.137) — same pin as every
      # other nextest job in this file. Both lists MUST come from the
      # same nextest version for the comparison to be meaningful.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: cache rust-guard binary
        id: rust-guard-selftest-bin-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            tools/rust-guard/target/debug/rust-guard
            tools/rust-guard/target/debug/rust-guard.exe
          key: rust-guard-bin-${{ runner.os }}-${{ hashFiles('tools/rust-guard/**/*.rs', 'tools/rust-guard/Cargo.toml', 'tools/rust-guard/Cargo.lock', 'rust-toolchain.toml') }}
      # On master pushes there is no merge base (HEAD *is* master); the
      # discovery diff is a PR-shaped gate and is skipped there.
      # shell: bash — windows-latest defaults to PowerShell, where the
      # `>> "$GITHUB_ENV"` append syntax is wrong.
      - name: compute merge base
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo "MERGE_BASE=$(git merge-base origin/master HEAD)" >> "$GITHUB_ENV"
      # Built for the campaign gate or the non-draft format smoke.
      - name: build rust-guard
        if: steps.rust-guard-selftest-bin-cache.outputs.cache-hit != 'true'
        run: cargo build --manifest-path tools/rust-guard/Cargo.toml --locked
      # FORMAT SMOKE — runs BEFORE and independent of the campaign gate:
      # proves the discovery tool round-trips REAL `cargo nextest list`
      # output on the default config (ubuntu only). shamir-collections has
      # no lib tests; shamir-types is the smallest crate that clearly does
      # (#[test] modules under crates/foundation/shamir-types/src/**/tests/).
      - name: format smoke (real nextest output must round-trip)
        if: matrix.os == 'ubuntu-latest' && matrix.config.id == 'default' && (github.event.pull_request.draft != true || needs.plan.outputs.full == 'true')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch
          cargo nextest list -p shamir-types --lib --message-format json > .scratch/smoke.json
          printf 'base = "smoke"\n' > .scratch/empty-delta.toml
          tools/rust-guard/target/debug/rust-guard discovery \
            --base-list .scratch/smoke.json \
            --head-list .scratch/smoke.json \
            --delta .scratch/empty-delta.toml \
            --kind lib
          printf '{"rust-suites":{},"test-count":0}' > .scratch/empty.json
          if tools/rust-guard/target/debug/rust-guard discovery \
            --base-list .scratch/empty.json \
            --head-list .scratch/empty.json \
            --delta .scratch/empty-delta.toml \
            --kind lib; then
            echo "::error::empty list passed vacuously"
            exit 1
          else
            echo "empty list correctly rejected"
          fi
          python3 -I scripts/ci/gates/loom_preflight_check.py --list-file .scratch/smoke.json
          rm -rf .scratch
      # Same selection as source-integrity; discovery supports one campaign.
      - name: campaign selection
        id: select
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          git diff --name-only "$MERGE_BASE"...HEAD \
            | python3 -I scripts/ci/rust_guard_select.py \
                --stages .rust-guard/stages.toml \
                --metadata metadata.json --root . > campaigns.tsv
          rm -f metadata.json
          if [ -s campaigns.tsv ]; then
            if [ "$(wc -l < campaigns.tsv)" -gt 1 ]; then
              echo "::error::test-discovery supports one campaign per PR"
              exit 1
            fi
            IFS=$'\t' read -r name delta pkgs dirs ddelta < campaigns.tsv
            echo "::notice::test-discovery campaign '$name' (packages: $pkgs)"
            echo "campaigns=yes" >> "$GITHUB_OUTPUT"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
            echo "pkgkey=${pkgs//,/_}" >> "$GITHUB_OUTPUT"
            echo "ddelta=$ddelta" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no active campaign package touched by this diff; test discovery skipped"
          fi
      # Base list cache is keyed by base SHA, OS, config and packages.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: base_list_cache
        if: steps.select.outputs.campaigns != ''
        with:
          path: base-list.json
          key: test-discovery-base-${{ matrix.os }}-${{ env.MERGE_BASE }}-${{ matrix.config.id }}-${{ steps.select.outputs.pkgkey }}
      # The base list is produced in a worktree of the merge base with a
      # separate CARGO_TARGET_DIR, so base and head never share build
      # artifacts and the toolchain/features stay identical (same
      # nextest pin, same ${{ matrix.config.flags }}). bash + $RUNNER_TEMP
      # on every runner (Git Bash on windows-latest).
      - name: base list (worktree at merge base)
        if: steps.select.outputs.campaigns != '' && steps.base_list_cache.outputs.cache-hit != 'true'
        env:
          PKGS: ${{ steps.select.outputs.pkgs }}
        shell: bash
        run: |
          set -euo pipefail
          git worktree add .scratch-ci-base "$MERGE_BASE"
          (
            cd .scratch-ci-base
            cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/base-metadata.json"
            present=$(python3 -I "$GITHUB_WORKSPACE/scripts/ci/rust_guard_select.py" \
              --present-in "$RUNNER_TEMP/base-metadata.json" --packages "$PKGS")
            args=()
            IFS=',' read -ra packages <<< "$present"
            for pkg in "${packages[@]}"; do args+=(-p "$pkg"); done
            CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" \
              cargo nextest list "${args[@]}" ${{ matrix.config.flags }} --message-format json
          ) > "$GITHUB_WORKSPACE/base-list.json"
          git worktree remove --force .scratch-ci-base
      - name: head list
        if: steps.select.outputs.campaigns != ''
        env:
          PKGS: ${{ steps.select.outputs.pkgs }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra packages <<< "$PKGS"
          for pkg in "${packages[@]}"; do args+=(-p "$pkg"); done
          cargo nextest list "${args[@]}" ${{ matrix.config.flags }} --message-format json > head-list.json
      # Findings (lost test, duplicate, lost target, empty list, blocked
      # comparison) fail the step — the gate is fail-closed.
      - name: discovery diff (fails on findings)
        if: steps.select.outputs.campaigns != ''
        env:
          DDELTA: ${{ steps.select.outputs.ddelta }}
        shell: bash
        run: |
          set -euo pipefail
          if tools/rust-guard/target/debug/rust-guard discovery \
            --base-list base-list.json \
            --head-list head-list.json \
            --delta "$DDELTA" \
            --kind lib
          then :
          else
            rc=$?
            tools/rust-guard/target/debug/rust-guard discovery \
              --base-list base-list.json \
              --head-list head-list.json \
              --delta "$DDELTA" \
              --kind lib \
              --base-sha "$(git rev-parse "$MERGE_BASE")" \
              --suggest-delta suggested-discovery.toml || true
            exit "$rc"
          fi
      - name: upload suggested deltas
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rust-guard-suggested-delta-${{ matrix.os }}-${{ matrix.config.id }}
          path: suggested-*.toml
          if-no-files-found: ignore

  # The tool's own test suite (`tools/rust-guard/tests/`). Runs in CI ONLY —
  # CLAUDE.md bans local builds/tests. The crate is workspace-excluded, so
  # the `test` job above never runs these. Same perimeter-guard constraint
  # as the loom job: raw `cargo test` is blocked by the committed
  # .cargo/config.toml runner even in CI, so tests go through cargo-nextest
  # (the wrapper the guard sanctions). ubuntu-only: pure std + syn parsing,
  # nothing OS-specific.
  rust-guard-selftest:
    name: rust-guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [affected]
    if: always() && (github.event_name != 'push' || needs.affected.outputs.tree_green != 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
        with:
          tool: nextest@0.9.137
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        with:
          workspaces: tools/rust-guard
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      # Cache workspace-crate compilation across runs (rust-cache keeps only
      # third-party deps); a crate whose inputs did not change is not rebuilt.
      - name: enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - working-directory: tools/rust-guard
        run: cargo nextest run --locked --no-fail-fast
      - run: cargo fmt --manifest-path tools/rust-guard/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/rust-guard/Cargo.toml --all-targets --locked -- -D warnings

  # DEC-3 Q2-b: the Node native binding (`shamir-client`, napi-rs cdylib in
  # crates/client/shamir-client-node). Proves the package BUILD is reproducible and
  # CONSUMABLE: `npm ci` + `npm run build:debug` (napi build --platform
  # --output-dir native --js index.js --dts index.d.ts) must not
  # drift the generated `native/index.js` / `native/index.d.ts`, the packed
  # tarball must install into a clean consumer directory whose `require`
  # exports the class and the typed error as functions, and the published
  # `.d.ts` must typecheck an external consumer (tests/e2e/packaging/
  # consumer.ts) under `tsc --noEmit`. windows-latest: the binding is
  # windows-first (x86_64-pc-windows-msvc is the primary napi target) and
  # the clippy matrix already covers the Rust side cross-platform. Full
  # tier only (same `if` shape as the other gating jobs). The e2e suites
  # that EXERCISE the binding against a live server live in
  # `.github/workflows/ts-e2e-nightly.yml` (cron + `workflow_dispatch`).
  node-binding:
    name: node binding (shamir-client)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [plan, affected]
    if: needs.plan.outputs.full == 'true' && needs.affected.outputs.run_node == 'true' && needs.affected.outputs.tree_green != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
        if: needs.affected.outputs.run_node == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: needs.affected.outputs.run_node == 'true'
        with:
          # Node 22 = active LTS; satisfies the binding's `>=18` engines
          # floor (same pin as the ts-unit job). npm cache keyed on the
          # binding lockfile so `npm ci` below stays reproducible.
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/client/shamir-client-node/package-lock.json
      - name: npm ci (binding)
        if: needs.affected.outputs.run_node == 'true'
        working-directory: crates/client/shamir-client-node
        run: npm ci
      - name: napi build (debug)
        if: needs.affected.outputs.run_node == 'true'
        working-directory: crates/client/shamir-client-node
        run: npm run build:debug
      - name: generated-file drift check
        if: needs.affected.outputs.run_node == 'true'
        id: napi-drift
        working-directory: crates/client/shamir-client-node
        run: git diff --exit-code -- native/index.js native/index.d.ts
      # Local napi builds are banned, so the committed generated files are
      # taken from this artifact when the drift check above fails.
      - name: upload generated files on drift
        if: failure() && steps.napi-drift.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          overwrite: true
          name: napi-generated-files
          path: |
            crates/client/shamir-client-node/native/index.js
            crates/client/shamir-client-node/native/index.d.ts
          if-no-files-found: error
          retention-days: 7
      - name: npm pack (tarball into runner temp)
        if: needs.affected.outputs.run_node == 'true'
        working-directory: crates/client/shamir-client-node
        shell: bash
        run: npm pack --pack-destination "$RUNNER_TEMP"
      # Consume the packed tarball exactly like an external user: fresh
      # directory, plain `npm install <tarball>`, then require the package.
      # typescript + @types/node are installed INTO THE CONSUMER DIRECTORY
      # (pinned, like the binding's own devDeps): a tarball consumer never
      # gets devDependencies, so the binding's `npm ci` tree cannot provide
      # a tsc binary here — and the typecheck must resolve 'shamir-client'
      # from THIS node_modules, which only an install beside the sources
      # achieves (see the tsc step below).
      - name: install tarball + consumer smoke
        if: needs.affected.outputs.run_node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm install "$RUNNER_TEMP/shamir-client-0.1.0.tgz" typescript@7.0.2 @types/node@22.20.4
          node -e "const m = require('shamir-client'); if (typeof m.ShamirClient !== 'function') { throw new Error('ShamirClient is not a function'); } if (typeof m.ShamirDbError !== 'function') { throw new Error('ShamirDbError is not a function'); } console.log('consumer smoke OK');"
      # Copy the consumer source + tsconfig next to the consumer's
      # node_modules so Node16 module resolution finds the installed
      # 'shamir-client' — then typecheck with `tsc --noEmit`.
      - name: tsc --noEmit (packaging consumer)
        if: needs.affected.outputs.run_node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer/pkg"
          cp tests/e2e/packaging/consumer.ts tests/e2e/packaging/tsconfig.json "$RUNNER_TEMP/consumer/pkg/"
          cd "$RUNNER_TEMP/consumer"
          npx tsc --noEmit -p pkg/tsconfig.json
      - name: node scope notice
        if: needs.affected.outputs.run_node != 'true'
        shell: bash
        run: 'echo "::notice::matrix selected no Node binding checks"'

  matrix-self-check:
    name: matrix self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: matrix consistency and production coverage
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > cargo-metadata.json
          python3 -I -m unittest discover -s scripts/ci/tests
          python3 -I -m unittest discover -s scripts/ci/tests/matrix
          python3 -I scripts/ci/matrix/test_matrix.py --check --metadata cargo-metadata.json
          python3 -I scripts/ci/matrix/test_matrix.py --backtest HEAD~30..HEAD --metadata cargo-metadata.json
          python3 -I - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          metadata = json.loads(pathlib.Path("cargo-metadata.json").read_text(encoding="utf-8"))
          members = set(metadata.get("workspace_members", []))
          packages = []
          for package in metadata["packages"]:
              if package["id"] not in members:
                  continue
              manifest = pathlib.Path(package["manifest_path"]).resolve()
              packages.append((package["name"], manifest.parent))

          def production_owner(path):
              candidate = (root / pathlib.PurePosixPath(path)).resolve()
              owners = [(name, directory) for name, directory in packages
                        if candidate == directory or directory in candidate.parents]
              if not owners:
                  return None
              name, directory = max(owners, key=lambda item: len(item[1].parts))
              relative = candidate.relative_to(directory).parts
              if "tests" in relative or "benches" in relative or "examples" in relative:
                  return None
              if candidate.suffix == ".md" or candidate.name.endswith("_tests.rs"):
                  return None
              return name

          commits = subprocess.check_output(
              ["git", "rev-list", "--first-parent", "-n", "30", "HEAD"], text=True
          ).splitlines()
          failures = []
          for commit in commits:
              parent = subprocess.check_output(["git", "rev-parse", commit + "^1"], text=True).strip()
              changed = [path for path in subprocess.check_output(
                  ["git", "diff", "--no-renames", "--name-only", "-z", parent, commit], text=True
              ).split("\0") if path]
              required = {owner for path in changed if (owner := production_owner(path))}
              if not required:
                  continue
              result = subprocess.run(
                  [sys.executable, "-I", "scripts/ci/matrix/test_matrix.py",
                   "--range", parent + ".." + commit,
                   "--metadata", "cargo-metadata.json", "--format", "json"],
                  check=True, capture_output=True, text=True,
              )
              selected = {row["name"] for row in json.loads(result.stdout)["crates"]
                          if row["lib"] or row["integration"] == "all" or bool(row["integration"])}
              missing = sorted(required - selected)
              if missing:
                  failures.append("%s omitted production crate(s): %s" % (commit, ", ".join(missing)))
          if failures:
              raise SystemExit("\n".join(failures))
          print("production-change selection asserted for %d first-parent commits" % len(commits))
          PY

# `if: always()` + full `needs:` so it evaluates even when jobs were
# skipped, and the stdlib script scripts/ci/gates/merge_gate_check.py
# (unit tests: scripts/ci/tests/gates/merge/test_merge_gate_check.py) decides from
# toJSON(needs): failure/cancelled anywhere fails; skipped fails unless
# by design for the tier (draft PR: full tier skipped, fast must pass;
# ready/master/dispatch: fast skipped by design). A DRAFT PR always
# fails this gate with "draft PR: full matrix not run, not merge-ready"
# — draft fast-tier success never authorises a merge. needs comes in via
# the NEEDS_JSON env var (never string-interpolated into the shell line)
# to avoid quoting/injection breakage. Read-only, stdlib-only python:
# no permissions beyond the workflow default, no toolchain.
  merge-gate:
    name: merge gate (required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [plan, affected, fast, fmt, clippy, wasm32-guest-check, test-build, test, integration, ts-unit, cooldown, deny, loom-model, source-integrity, rust-guard-selftest, rustdoc, engine-features, test-discovery, node-binding, matrix-self-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT_FAST: ${{ github.event.pull_request.draft == true && needs.plan.outputs.full != 'true' }}
        run: |
          echo "$NEEDS_JSON" | python3 -I scripts/ci/gates/merge_gate_check.py --event "$EVENT_NAME" --draft "$DRAFT_FAST"
