name: ts-e2e-nightly

# Nightly e2e lane for BOTH TypeScript client surfaces that drive a REAL
# `shamir-server` subprocess — too heavy for the per-PR `ci.yml` gate, too
# important to leave unrun. (This workflow IS the follow-up `ci.yml`'s old
# NOTE comment used to call unaddressed.)
#
# Two distinct e2e surfaces, kept in ONE file because they share the
# "build a release server, then drive it" shape and the same off-hours
# cadence — see each job's header for why it lives here rather than in its
# own workflow:
#
#  - `ts-e2e`   : the pure-TypeScript client (`crates/shamir-client-ts`,
#                 `src/__tests__/**/e2e-*.test.ts`, ~25 suites). Drives a real
#                 `shamir-server` over TCP/WS using the pure-TS client — NO
#                 native binding involved. In per-PR `ci.yml`'s `ts-unit`
#                 job these suites self-skip (no server binary present);
#                 here the binary is built first so they run for real.
#                 ubuntu-latest — pure TS + a Rust server build, no
#                 platform-specific binding.
#
#  - `node-e2e` : the Node.js NATIVE binding (`shamir-client-node`, a regular
#                 Cargo workspace member) driven through
#                 `tests/e2e/`. windows-latest — see the job header for the
#                 MSVC reasoning (short version: the MSVC target is the
#                 established, primary napi build path on Windows,
#                 matching CLAUDE.md's "MSVC-only on Windows — built
#                 separately").
#
# WHY NIGHTLY, NOT PER-PR: each job builds a release `shamir-server` (the
# `node-e2e` job ALSO builds the napi `.node`), which is far too slow for a
# per-PR gate. e2e correctness is also lower-frequency than unit tests — a
# nightly cadence catches regressions without blocking every PR. Off-hours
# scheduling avoids contending with the per-PR CI runner pool (same
# convention as `stress-nightly.yml`).

on:
  schedule:
    # 05:47 UTC nightly — off the top/bottom of the hour to ease load on the
    # shared GitHub Actions runner pool. Distinct from `stress-nightly.yml`'s
    # `23 4 * * *` (04:23 UTC) and `supply-chain.yml`'s Sunday `17 3 * * 0`
    # (03:17 UTC), so the three scheduled lanes don't land on top of each
    # other. Nightly (not weekly) because these are correctness suites — a
    # regression introduced any day should surface within ~24h.
    - cron: "47 5 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege default. Both jobs (ts-e2e / node-e2e) only read the repo and
# build + run e2e suites — no push/comment/registry write.
permissions:
  contents: read

jobs:
  # ── TS client e2e (pure TypeScript, no native binding) ────────────────────
  ts-e2e:
    name: ts client e2e (shamir-client-ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      - name: Build shamir-server release binary
        run: cargo build --release --locked -p shamir-server
      # Export an explicit, verified release-binary path: the TS suites self-skip
      # when the server is missing, so a successful build must never silently
      # turn this lane into a skip-only run.
      - name: Verify shamir-server release binary
        shell: bash
        run: |
          test -x "$GITHUB_WORKSPACE/target/release/shamir-server"
          echo "SHAMIR_SERVER_BIN=$GITHUB_WORKSPACE/target/release/shamir-server" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/shamir-client-ts/package-lock.json
      - name: Install TypeScript client dependencies
        run: npm ci
        working-directory: crates/shamir-client-ts
      - name: TS client typecheck
        run: npm run typecheck
        working-directory: crates/shamir-client-ts
      # `SERVER_AVAILABLE` is now true via the explicit SHAMIR_SERVER_BIN above;
      # a non-zero exit (any failed test) fails the job.
      - name: TS client e2e (vitest)
        run: npm test
        working-directory: crates/shamir-client-ts
  # ── Node napi e2e (native binding, tests/e2e/) ────────────────────────────
  #
  # WHY WINDOWS, NOT UBUNTU: napi-rs IS cross-platform in principle
  # (`shamir-client-node/package.json`'s `napi.targets` lists linux + macos +
  # windows triples, so the binding is DESIGNED to build everywhere). But the
  # established, primary BUILD path in THIS repo is Windows/MSVC:
  #
  #  - `napi.targets` in `shamir-client-node/package.json` includes
  #    `x86_64-pc-windows-msvc`, because napi-rs on Windows requires MSVC
  #    linkage (delay-load against `node.exe`); the linux napi build would
  #    be untested here.
  #  - `CLAUDE.md` Workspace section: the binding is a regular workspace
  #    member, MSVC-only on Windows (use msvc, not gnu).
  #  - The shipped prebuilt artifact is
  #    `native/shamir-client.win32-x64-msvc.node` in the crate.
  #  - `tests/e2e/README.md`'s steps assume the Windows/MSVC dev environment.
  #
  # The "MSVC-only on Windows" note is a Windows-BUILD-path constraint (when
  # on Windows, use msvc not gnu), not a "Windows-only ever" statement — but
  # until a linux napi build is explicitly validated, windows-latest is the
  # conservative choice that matches the repo's established MSVC build path
  # and
  # runs the suite exactly as the repo's dev docs describe. windows-latest
  # runners ship MSVC + the .NET framework napi-rs shells out to, so `npm
  # run build` (napi build --platform --release, via
  # tests/e2e/package.json) works with no extra setup. (If a future
  # decision validates the linux napi path, this job can move to ubuntu —
  # the cross-platform target list in package.json is the evidence it would
  # work; that's a separate follow-up.)
  #
  # Follows `tests/e2e/README.md`'s documented steps exactly: `npm install`
  # → `npm run build` → `npm test`. `shell: bash` (Git Bash on the windows
  # runner) for parity with ci.yml's test steps and to avoid PowerShell
  # `&&`/path quirks.
  node-e2e:
    name: node napi e2e (tests/e2e)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a  # 1.95.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      # No `cache: npm` here (unlike the `ts-e2e` job above): F-68 cluster B
      # root cause — this step used to set `cache: npm` +
      # `cache-dependency-path: tests/e2e/package-lock.json`, but
      # `tests/e2e/package-lock.json` is deliberately gitignored
      # (`.gitignore` line ~30, added in `0b9bced2`'s commit message: "the
      # lockfile churns on every binding rebuild and carries no useful
      # information" — `tests/e2e`'s only real dependency is
      # `shamir-client: file:../../crates/shamir-client-node`, a local path
      # dependency with no registry version to pin; the lockfile mostly just
      # records `@msgpack/msgpack`'s resolved tarball). In a clean CI
      # checkout that path never exists, so `setup-node`'s cache step failed
      # outright with "Some specified paths were not resolved, unable to
      # cache dependencies" — deterministically, not flakily, on every
      # scheduled run. Committing the lockfile would fight the documented
      # intent above; dropping the cache config here (this job's only
      # per-PR-scale npm work is one `napi build`, not worth chasing a cache
      # for anyway) is the fix that matches the actual policy.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      # `npm run build` = build:client-ts (`cd ../../crates/shamir-client-ts
      # && npm ci && npm run build`, producing that package's gitignored
      # `dist/` -- tests/e2e depends on `@shamir/client` (file:../../
      # crates/shamir-client-ts, task #919) for its query-builder helpers;
      # a fresh checkout has no dist/ until this runs, otherwise
      # `require('@shamir/client')` fails with MODULE_NOT_FOUND) +
      # build:server (`cargo build --release -p shamir-server`, producing
      # target/release/shamir-server.exe) + build:binding (`cd
      # shamir-client-node && npm ci && npm run build` — napi build
      # --platform --release --output-dir native --js index.js --dts
      # index.d.ts — producing native/shamir-client.<triple>.node), per
      # tests/e2e/package.json.
      # `npm test` then runs `node e2e.test.js`, which spawns the server and
      # drives the native binding through the full TLS+SCRAM+Batch flow. A
      # non-zero exit fails the job.
      - name: Build server + napi binding, run node e2e
        run: npm install && npm run build && npm test
        working-directory: tests/e2e
        shell: bash
